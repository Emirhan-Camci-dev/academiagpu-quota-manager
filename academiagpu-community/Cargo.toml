[package]
name = "academiagpu-community"
version = "0.1.0"
edition = "2021"
authors = ["Emirhan CAMCI <byemir@live.com>"]
description = "AcademiaGPU: GPU Cluster Quota & VRAM Isolation (Community Edition)"
license = "AGPL-3.0"

[dependencies]
nvml-wrapper = "0.10.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
sysinfo = "0.30"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
